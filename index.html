<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Lab — Component shell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #fdfdfd;
      --text: #0d0d0d;
      --text-muted: #6c6c6c;
      --text-subtle: #767676;
      --text-faint: #8f8f8f;
      --stage: #f9f9f9;
      --stage-border: rgba(0, 0, 0, 0.04);
      --surface: #ffffff;
      --chip: #f4f4f4;
      --chip-hover: #f1f1f1;
      --chip-pressed: #eae9e9;
      --nav-wash: rgba(0, 0, 0, 0.03);
      --nav-wash-strong: rgba(0, 0, 0, 0.05);
      --tab-bar: #f1f1f1;
      --tab-pill: #ffffff;
      --icon: #3d3d3d;
      --icon-muted: #838383;
      --overlay: rgba(253, 253, 253, 0.72);
      --cmdk-shadow:
        0 16px 48px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(0, 0, 0, 0.06);
      --material-shadow:
        0 4px 42px rgba(0, 0, 0, 0.06),
        0 2px 6px rgba(0, 0, 0, 0.05),
        0 0 0 1px rgba(0, 0, 0, 0.06);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 300ms;
      --dur-ui: 150ms;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      --radius-stage: 24px;
      --radius-card: 12px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121212;
      --text: #ffffff;
      --text-muted: rgba(202, 202, 202, 0.7);
      --text-subtle: #767676;
      --text-faint: #8f8f8f;
      --stage: #131313;
      --stage-border: rgba(255, 255, 255, 0.02);
      --surface: #181818;
      --chip: rgba(255, 255, 255, 0.07);
      --chip-hover: rgba(255, 255, 255, 0.1);
      --chip-pressed: rgba(255, 255, 255, 0.08);
      --nav-wash: rgba(255, 255, 255, 0.06);
      --nav-wash-strong: rgba(255, 255, 255, 0.08);
      --tab-bar: #1c1c1c;
      --tab-pill: #2a2a2a;
      --icon: #ededed;
      --icon-muted: #9a9a9a;
      --overlay: rgba(18, 18, 18, 0.78);
      --cmdk-shadow:
        0 16px 48px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 0 0 1px rgba(255, 255, 255, 0.06);
      --material-shadow:
        0 1px 3px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        inset 0 0 0 1px rgba(196, 196, 196, 0.08);
    }

    * { box-sizing: border-box; }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    button, input { font: inherit; color: inherit; }
    button { appearance: none; }
    a { color: inherit; }

    .app {
      position: relative;
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px 64px;
    }

    /* ── Nav ── */
    .site-nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
    }
    .site-nav-left, .site-nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 35px;
      text-decoration: none;
      color: var(--text);
      flex-shrink: 0;
    }
    .brand-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: var(--text);
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 4px 3px 3px 4px;
      border-radius: 2.5px;
      background: var(--bg);
      transition: background-color 0.2s ease;
    }
    .brand-word {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .brand-word span { color: var(--text-faint); font-weight: 400; }

    .nav-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 13px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 500;
      line-height: 16px;
      color: var(--text-muted);
      text-decoration: none;
      transition: background-color var(--dur-ui) ease, color var(--dur-ui) ease;
    }
    .nav-pill:hover, .nav-pill.is-active {
      color: var(--text);
      background: var(--nav-wash);
    }

    .icon-btn, .nav-search {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 36px;
      border: 0;
      border-radius: 50px;
      background: var(--nav-wash);
      color: var(--icon-muted);
      cursor: pointer;
      transition: background var(--dur-ui) var(--ease), color var(--dur-ui) ease;
    }
    .icon-btn { width: 36px; }
    .icon-btn:hover, .nav-search:hover {
      background: var(--chip-hover);
      color: var(--icon);
    }
    .nav-search {
      padding: 0 12px;
      font-size: 13px;
      font-weight: 500;
      color: #838383;
    }
    .nav-search-kbd {
      font-size: 11px;
      line-height: 16px;
      color: rgba(131, 131, 131, 0.7);
    }
    .nav-burger { display: none; }
    .nav-burger-box { position: relative; width: 16px; height: 16px; }
    .nav-burger-line {
      position: absolute;
      left: 1px; right: 1px;
      height: 1.5px;
      border-radius: 2px;
      background: currentColor;
      transition: top var(--dur) var(--ease), transform var(--dur) var(--ease) 40ms;
    }
    .nav-burger-line--top { top: 5px; }
    .nav-burger-line--bottom { top: 9.5px; }
    .nav-burger[aria-expanded="true"] .nav-burger-line--top { top: 7.25px; transform: rotate(45deg); }
    .nav-burger[aria-expanded="true"] .nav-burger-line--bottom { top: 7.25px; transform: rotate(-45deg); }

    /* ── Docs layout ── */
    .docs {
      width: 100%;
      padding: 32px 0 96px;
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      column-gap: 56px;
      align-items: start;
    }
    .docs-sidebar {
      position: sticky;
      top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      scrollbar-width: none;
      --fade-start: 0px;
      --fade-end: 0px;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--fade-start),
        #000 calc(100% - var(--fade-end)),
        transparent 100%);
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--fade-start),
        #000 calc(100% - var(--fade-end)),
        transparent 100%);
    }
    .docs-sidebar::-webkit-scrollbar { display: none; }
    .docs-group { display: flex; flex-direction: column; }
    .docs-group-label {
      font-size: 11px;
      line-height: 14px;
      color: var(--text-subtle);
      padding: 9px 12px;
    }
    .docs-link {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      width: 100%;
      text-align: left;
      text-decoration: none;
      font-size: 13px;
      line-height: 16px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }
    .docs-link:hover { background: var(--nav-wash); }
    .docs-link.is-active { background: var(--nav-wash-strong); }

    .docs-main { min-width: 0; }

    .detail-topbar {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .detail-arrow {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50px;
      background: var(--nav-wash);
      color: var(--text);
      cursor: pointer;
      transition: background 140ms ease, opacity 140ms ease;
    }
    .detail-arrow:hover { background: var(--chip-hover); }
    .detail-arrow:disabled { opacity: 0.35; cursor: default; }

    .detail-head {
      display: flex;
      flex-direction: column;
      gap: 21px;
    }
    .detail-title {
      margin: 0;
      font-weight: 500;
      font-size: 36px;
      line-height: 42px;
      letter-spacing: -0.18px;
    }
    .detail-sub {
      margin: 6px 0 0;
      font-size: 16px;
      line-height: 24px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .tabs {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      background: var(--tab-bar);
      border-radius: 48px;
      align-self: flex-start;
    }
    .tab {
      position: relative;
      z-index: 1;
      border: 0;
      background: transparent;
      height: 30px;
      padding: 4px 12px;
      border-radius: 48px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--dur) var(--ease);
    }
    .tab.is-active { color: var(--text); }
    .tabs-indicator {
      position: absolute;
      top: 3px;
      left: 0;
      height: calc(100% - 6px);
      width: 0;
      background: var(--tab-pill);
      border-radius: 48px;
      transform: translateX(0);
      transition: transform var(--dur) var(--ease), width var(--dur) var(--ease);
      pointer-events: none;
    }

    .detail-body { margin-top: 24px; max-width: 686px; }
    .panel { display: none; }
    .panel.is-active { display: block; }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 460px;
      border-radius: var(--radius-stage);
      background: var(--stage);
      box-shadow: inset 0 0 0 1px var(--stage-border);
      overflow: hidden;
    }
    .stage-slot {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 460px;
      padding: 32px;
    }
    .stage-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-faint);
      user-select: none;
    }
    .stage-empty-plus {
      width: 36px;
      height: 36px;
      border-radius: 50px;
      background: var(--chip);
      display: grid;
      place-items: center;
      color: var(--icon-muted);
    }
    .stage-empty-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-subtle);
    }
    .stage-empty-sub { font-size: 12px; }

    .btn-animate {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 50px;
      background: var(--chip);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: none;
      transition: background var(--dur-ui) ease;
    }
    .btn-animate.is-visible { display: inline-flex; align-items: center; }
    .btn-animate:hover { background: var(--chip-hover); }

    .notes {
      margin: 0;
      padding: 20px 4px 0;
      font-size: 15px;
      line-height: 24px;
      color: var(--text-muted);
    }
    .notes[hidden] { display: none; }

    /* ── Command palette ── */
    .cmdk {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 14vh 16px 16px;
      background: var(--overlay);
      backdrop-filter: blur(10px);
    }
    .cmdk.is-open { display: flex; }
    .cmdk-panel {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border-radius: 14px;
      box-shadow: var(--cmdk-shadow);
      overflow: hidden;
      animation: cmdk-in var(--dur) var(--ease);
    }
    @keyframes cmdk-in {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .cmdk-search {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--stage-border);
    }
    .cmdk-search input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 15px;
    }
    .cmdk-esc {
      font-size: 11px;
      color: var(--text-faint);
      background: var(--chip);
      border-radius: 6px;
      padding: 2px 6px;
    }
    .cmdk-list { padding: 8px; max-height: 360px; overflow: auto; }
    .cmdk-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      border: 0;
      background: transparent;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
    }
    .cmdk-item[aria-selected="true"], .cmdk-item:hover { background: var(--nav-wash); }
    .cmdk-item-label { font-size: 13px; font-weight: 500; }
    .cmdk-item-hint { font-size: 12px; color: var(--text-faint); }
    .cmdk-empty { padding: 24px 12px; text-align: center; color: var(--text-faint); font-size: 13px; }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 68px 16px auto;
      z-index: 40;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--cmdk-shadow);
      padding: 10px;
    }
    .mobile-menu.is-open { display: block; }

    @media (max-width: 860px) {
      .site-nav-menu { display: none; }
      .nav-search-label { display: none; }
      .nav-burger { display: inline-flex; }
      .docs { grid-template-columns: 1fr; padding-top: 8px; }
      .docs-sidebar { display: none; }
      .detail-title { font-size: 30px; line-height: 36px; }
      .stage, .stage-slot { min-height: 360px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="main">
    <header class="site-nav">
      <div class="site-nav-inner">
        <div class="site-nav-left">
          <a class="brand" href="#intro">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-word">Lab <span>/ shell</span></span>
          </a>
          <nav class="site-nav-menu">
            <a class="nav-pill is-active" href="#intro">组件</a>
          </nav>
        </div>
        <div class="site-nav-right">
          <button class="nav-search" id="search-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
              <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="nav-search-label">搜索</span>
            <span class="nav-search-kbd" id="search-kbd">⌘K</span>
          </button>
          <button class="icon-btn" id="theme-btn" type="button" aria-label="切换主题">
            <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 1.6v1.5M8 12.9v1.5M1.6 8h1.5M12.9 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" hidden>
              <path d="M13.2 9.4A5.4 5.4 0 1 1 6.6 2.8 4.3 4.3 0 0 0 13.2 9.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn nav-burger" id="burger" type="button" aria-label="菜单" aria-expanded="false">
            <span class="nav-burger-box">
              <span class="nav-burger-line nav-burger-line--top"></span>
              <span class="nav-burger-line nav-burger-line--bottom"></span>
            </span>
          </button>
        </div>
      </div>
    </header>

    <div class="docs">
      <aside class="docs-sidebar" id="sidebar"></aside>
      <div class="docs-main">
        <div class="detail-topbar">
          <button class="detail-arrow" id="prev-btn" type="button" aria-label="上一项">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8 10 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="detail-arrow" id="next-btn" type="button" aria-label="下一项">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <header class="detail-head">
          <div class="detail-titles">
            <h1 class="detail-title" id="title">Introduction</h1>
            <p class="detail-sub" id="subtitle"></p>
          </div>
          <div class="tabs" id="tabs">
            <span class="tabs-indicator" id="tab-indicator"></span>
            <button class="tab is-active" type="button" data-tab="preview">Preview</button>
            <button class="tab" type="button" data-tab="notes">Notes</button>
          </div>
        </header>

        <div class="detail-body">
          <section class="panel is-active" data-panel="preview">
            <div class="stage" id="stage">
              <button class="btn-animate" id="animate-btn" type="button">Animate</button>
              <div class="stage-slot" id="slot"></div>
            </div>
          </section>
          <section class="panel" data-panel="notes">
            <div class="notes" id="notes"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div class="mobile-menu" id="mobile-menu"></div>

  <div class="cmdk" id="cmdk" hidden>
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="搜索组件">
      <div class="cmdk-search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input id="cmdk-input" type="search" placeholder="搜索组件…" autocomplete="off" />
        <span class="cmdk-esc">esc</span>
      </div>
      <div class="cmdk-list" id="cmdk-list"></div>
    </div>
  </div>

  <script>
    /* ============================================================
       CATALOG
       后面加组件只改这里：push 一条，写 render(stage)。
       render 负责把 DOM 挂到舞台上；返回函数则在切走时清理。
       有 animate(stage) 时，舞台左上角会出现 Animate 按钮。
       ============================================================ */
    const GROUPS = [
      {
        id: "start",
        label: "开始",
        items: [
          {
            id: "intro",
            title: "Introduction",
            subtitle: "先搭壳，组件后面再往里挂。",
            notes: "这是空壳。侧栏、顶栏、舞台、主题、搜索都已经通了。你丢组件过来时，把它登记进 CATALOG 即可。",
            render(stage) {
              stage.innerHTML = `
                <div class="stage-empty">
                  <div class="stage-empty-plus" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div class="stage-empty-title">壳已经好了</div>
                  <div class="stage-empty-sub">组件会挂在这个舞台上</div>
                </div>`;
            },
          },
        ],
      },
      {
        id: "components",
        label: "组件",
        items: [
          {
            id: "slot-1",
            title: "Empty slot",
            subtitle: "下一个组件放这里",
            notes: "占位。你给我组件后，我会替换这条的 render。",
            render(stage) {
              stage.innerHTML = `
                <div class="stage-empty">
                  <div class="stage-empty-plus" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div class="stage-empty-title">把组件放到这里</div>
                  <div class="stage-empty-sub">丢过来之后挂到这个槽</div>
                </div>`;
            },
          },
        ],
      },
    ];

    const ITEMS = GROUPS.flatMap((g) => g.items.map((item) => ({ ...item, group: g.id })));

    const $ = (id) => document.getElementById(id);
    const sidebar = $("sidebar");
    const mobileMenu = $("mobile-menu");
    const slot = $("slot");
    const titleEl = $("title");
    const subEl = $("subtitle");
    const notesEl = $("notes");
    const animateBtn = $("animate-btn");
    const prevBtn = $("prev-btn");
    const nextBtn = $("next-btn");
    const cmdk = $("cmdk");
    const cmdkInput = $("cmdk-input");
    const cmdkList = $("cmdk-list");
    const burger = $("burger");
    const themeBtn = $("theme-btn");
    const tabsEl = $("tabs");
    const indicator = $("tab-indicator");

    let currentId = null;
    let cleanup = null;
    let currentTab = "preview";
    let cmdkIndex = 0;
    let cmdkHits = ITEMS;

    function itemById(id) {
      return ITEMS.find((x) => x.id === id) || ITEMS[0];
    }
    function indexOf(id) {
      return ITEMS.findIndex((x) => x.id === id);
    }

    function renderSidebar(root) {
      root.innerHTML = GROUPS.map((group) => `
        <div class="docs-group">
          <div class="docs-group-label">${group.label}</div>
          ${group.items.map((item) => `
            <a class="docs-link${item.id === currentId ? " is-active" : ""}" href="#${item.id}">${item.title}</a>
          `).join("")}
        </div>
      `).join("");
    }

    function updateSidebarFade() {
      const el = sidebar;
      if (!el) return;
      const start = el.scrollTop > 2 ? 16 : 0;
      const end = el.scrollTop + el.clientHeight < el.scrollHeight - 2 ? 16 : 0;
      el.style.setProperty("--fade-start", start + "px");
      el.style.setProperty("--fade-end", end + "px");
    }

    function mount(id) {
      const item = itemById(id);
      currentId = item.id;
      if (location.hash.slice(1) !== item.id) {
        history.replaceState(null, "", "#" + item.id);
      }
      titleEl.textContent = item.title;
      subEl.textContent = item.subtitle || "";
      notesEl.textContent = item.notes || "还没有备注。";
      document.title = item.title + " — Lab";

      if (typeof cleanup === "function") {
        try { cleanup(); } catch (_) {}
      }
      cleanup = null;
      slot.replaceChildren();

      if (typeof item.render === "function") {
        cleanup = item.render(slot) || null;
      }

      const canAnimate = typeof item.animate === "function";
      animateBtn.classList.toggle("is-visible", canAnimate);
      animateBtn.onclick = canAnimate ? () => item.animate(slot) : null;

      const i = indexOf(item.id);
      prevBtn.disabled = i <= 0;
      nextBtn.disabled = i >= ITEMS.length - 1;

      renderSidebar(sidebar);
      renderSidebar(mobileMenu);
      updateSidebarFade();
      closeMobile();
    }

    function move(delta) {
      const i = indexOf(currentId);
      const next = ITEMS[i + delta];
      if (next) location.hash = next.id;
    }

    function setTab(name) {
      currentTab = name;
      tabsEl.querySelectorAll(".tab").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.tab === name);
      });
      document.querySelectorAll("[data-panel]").forEach((panel) => {
        panel.classList.toggle("is-active", panel.dataset.panel === name);
      });
      const active = tabsEl.querySelector(".tab.is-active");
      if (!active) return;
      const parent = tabsEl.getBoundingClientRect();
      const box = active.getBoundingClientRect();
      indicator.style.width = box.width + "px";
      indicator.style.transform = `translateX(${box.left - parent.left}px)`;
    }

    /* theme */
    function systemDark() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    }
    function resolvedTheme() {
      const saved = localStorage.getItem("lab-theme") || "system";
      return saved === "system" ? (systemDark() ? "dark" : "light") : saved;
    }
    function applyTheme() {
      const saved = localStorage.getItem("lab-theme") || "system";
      const theme = resolvedTheme();
      document.documentElement.dataset.theme = theme;
      const dark = theme === "dark";
      $("icon-sun").hidden = dark;
      $("icon-moon").hidden = !dark;
      themeBtn.title = saved === "system" ? "主题：跟随系统" : (dark ? "主题：深色" : "主题：浅色");
    }
    function cycleTheme() {
      const order = ["system", "light", "dark"];
      const cur = localStorage.getItem("lab-theme") || "system";
      const next = order[(order.indexOf(cur) + 1) % order.length];
      localStorage.setItem("lab-theme", next);
      applyTheme();
    }

    /* command palette */
    function openCmdk() {
      cmdk.hidden = false;
      cmdk.classList.add("is-open");
      cmdkInput.value = "";
      cmdkIndex = 0;
      renderCmdk("");
      requestAnimationFrame(() => cmdkInput.focus());
    }
    function closeCmdk() {
      cmdk.classList.remove("is-open");
      cmdk.hidden = true;
    }
    function renderCmdk(q) {
      const query = q.trim().toLowerCase();
      cmdkHits = ITEMS.filter((item) =>
        !query ||
        item.title.toLowerCase().includes(query) ||
        (item.subtitle || "").toLowerCase().includes(query)
      );
      if (!cmdkHits.length) {
        cmdkList.innerHTML = `<div class="cmdk-empty">没有匹配的组件</div>`;
        return;
      }
      cmdkIndex = Math.min(cmdkIndex, cmdkHits.length - 1);
      cmdkList.innerHTML = cmdkHits.map((item, i) => `
        <button class="cmdk-item" type="button" data-id="${item.id}" aria-selected="${i === cmdkIndex}">
          <span class="cmdk-item-label">${item.title}</span>
          <span class="cmdk-item-hint">${item.subtitle || ""}</span>
        </button>
      `).join("");
    }
    function pickCmdk(id) {
      closeCmdk();
      location.hash = id;
    }

    function closeMobile() {
      burger.setAttribute("aria-expanded", "false");
      mobileMenu.classList.remove("is-open");
    }

    /* events */
    window.addEventListener("hashchange", () => mount(location.hash.slice(1)));
    prevBtn.addEventListener("click", () => move(-1));
    nextBtn.addEventListener("click", () => move(1));
    themeBtn.addEventListener("click", cycleTheme);
    $("search-btn").addEventListener("click", openCmdk);
    sidebar.addEventListener("scroll", updateSidebarFade);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

    tabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (btn) setTab(btn.dataset.tab);
    });

    burger.addEventListener("click", () => {
      const open = burger.getAttribute("aria-expanded") === "true";
      burger.setAttribute("aria-expanded", String(!open));
      mobileMenu.classList.toggle("is-open", !open);
    });

    cmdk.addEventListener("click", (e) => {
      if (e.target === cmdk) closeCmdk();
      const item = e.target.closest(".cmdk-item");
      if (item) pickCmdk(item.dataset.id);
    });
    cmdkInput.addEventListener("input", () => {
      cmdkIndex = 0;
      renderCmdk(cmdkInput.value);
    });

    document.addEventListener("keydown", (e) => {
      const metaK = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k";
      if (metaK) {
        e.preventDefault();
        cmdk.classList.contains("is-open") ? closeCmdk() : openCmdk();
        return;
      }
      if (e.key === "Escape") {
        closeCmdk();
        closeMobile();
        return;
      }
      if (!cmdk.classList.contains("is-open")) {
        if (e.key === "ArrowLeft") move(-1);
        if (e.key === "ArrowRight") move(1);
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        cmdkIndex = Math.min(cmdkIndex + 1, cmdkHits.length - 1);
        renderCmdk(cmdkInput.value);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        cmdkIndex = Math.max(cmdkIndex - 1, 0);
        renderCmdk(cmdkInput.value);
      } else if (e.key === "Enter" && cmdkHits[cmdkIndex]) {
        e.preventDefault();
        pickCmdk(cmdkHits[cmdkIndex].id);
      }
    });

    $("search-kbd").textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? "⌘K" : "Ctrl K";

    applyTheme();
    mount(location.hash.slice(1) || "intro");
    requestAnimationFrame(() => setTab("preview"));
    window.addEventListener("resize", () => setTab(currentTab));
  </script>
</body>
</html>
